<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Numeric Icon Generator</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <h1>Numeric Icon Generator</h1>

  <div class="container">

    <input id="inputText" type="text" placeholder="文字または数値を入力">

    <button id="generate">生成</button>

    <div id="iconArea">
      <svg id="icon" width="250" height="250"></svg>
    </div>

    <div class="buttons">
      <button id="downloadPNG">PNGダウンロード</button>
      <button id="downloadSVG">SVGダウンロード</button>
    </div>

  </div>

  <script src="script.js"></script>

</body>
</html>
